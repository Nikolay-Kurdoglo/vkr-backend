version: '3.5'

services:
  backend:
    image: vkr_backend
    env_file:
      - .env
    restart: always
    platform: linux/amd64
    volumes:
      - ./:/srv
    depends_on:
      - db
  
  nginx:
    image: nginx
    ports:
      - 5050:80
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
    platform: linux/amd64
    restart: always
    depends_on:
      - backend
  db:
    image: postgres:17.4-alpine
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - vkr-pg-data:/var/lib/postgresql/data

volumes:
  vkr-pg-data:
    driver: local
